<!DOCTYPE html>
<!-- Version: v3.0 - Issac - 2026-06-06 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現場需求紀錄 v3.0</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<style>
:root{
  --fs:system-ui,-apple-system,sans-serif;--fm:'Menlo','Consolas',monospace;
  --tp:#1a1410;--ts:#4a4540;--tt:#7a746e;--ti:#1a5c8a;--td:#b91c1c;
  --bp:#fdf8f2;--bs:#f0e8de;--bi:#dceefb;
  --bt:rgba(30,20,10,0.18);--bb:rgba(30,20,10,0.35);
  --rm:8px;--rl:12px;--pb:#e8e0d6;
}
@media(prefers-color-scheme:dark){:root{
  --tp:#f5f0e8;--ts:#c0b8ae;--tt:#857e76;--ti:#7dc4f0;--td:#f87171;
  --bp:#2a2520;--bs:#3a342e;--bi:#1a3a52;
  --bt:rgba(245,240,232,0.15);--bb:rgba(245,240,232,0.3);--pb:#1c1814;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--pb);min-height:100%}
body{font-family:var(--fs);font-size:15px;color:var(--tp)}
select,input{font-family:var(--fs);color:var(--tp);background:var(--bp)}
#inp-len::-webkit-inner-spin-button,#inp-len::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#inp-len{-moz-appearance:textfield;appearance:textfield}
#app{max-width:720px;margin:0 auto;padding:1rem}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px}
header h1{font-size:20px;font-weight:600}
header span{font-size:13px;color:var(--ts)}
.panel{background:var(--bp);border:1px solid var(--bt);border-radius:var(--rl);padding:1.1rem 1.25rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(30,20,10,0.08);transition:border .2s}
.panel.mode-new{border:3px solid #2563eb}
.panel.mode-edit{border:3px solid #c0392b}
.stitle{font-size:12px;font-weight:600;color:var(--ts);letter-spacing:.08em;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.mbadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.mb-new{background:#dbeafe;color:#1d4ed8}.mb-edit{background:#fee2e2;color:#b91c1c}
.lbl{font-size:13px;font-weight:500;color:var(--ts);margin-bottom:5px;display:block}
.preview{font-size:13px;color:var(--tt);margin-top:6px;font-family:var(--fm);min-height:18px;word-break:break-all}
.field{margin-bottom:14px}
.conn-row{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.ssel{padding:6px 4px;border-radius:var(--rm);border:1.5px solid var(--bb);font-size:14px;flex:1 1 auto;min-width:0;max-width:100%;background:var(--bp);color:var(--tp);width:auto}
.ssel:focus{outline:2px solid var(--ti);outline-offset:1px}
.ssel:disabled{opacity:.4}
.inp-b{padding:8px 12px;border-radius:var(--rm);border:1.5px solid var(--bb);font-size:15px;background:var(--bp);color:var(--tp);width:100%}
.inp-b:focus{outline:2px solid var(--ti);outline-offset:1px}
.spec-row{display:flex;gap:8px;flex-wrap:wrap}
.spec-item{display:flex;flex-direction:column;gap:4px;flex:1 1 auto;min-width:90px}
.btn{background:transparent;border:1.5px solid var(--bb);border-radius:var(--rm);padding:8px 16px;font-size:14px;cursor:pointer;color:var(--tp);display:inline-flex;align-items:center;gap:7px;font-family:var(--fs);white-space:nowrap;font-weight:500}
.btn:hover{background:var(--bs)}.btn:active{transform:scale(.98)}
.btn.pri{background:#1a4a6e;color:#fff;border-color:#1a4a6e}.btn.pri:hover{background:#15405f}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.add-fit{border-style:dashed;color:var(--ti);border-color:var(--ti)}
.btn.danger{color:var(--td);border-color:var(--td)}.btn.danger:hover{background:#fef2f2}
.btn-cp{background:transparent;border:1.5px solid var(--bb);border-radius:var(--rm);padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fs);color:var(--ts);display:inline-flex;align-items:center;gap:5px}
.btn-cp:hover{background:#e8f4fd;border-color:#1a5c8a;color:#1a5c8a}
.btn-ed{background:transparent;border:1.5px solid var(--bb);border-radius:var(--rm);padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fs);color:var(--ts);display:inline-flex;align-items:center;gap:5px}
.btn-ed:hover{background:#fff7e6;border-color:#b45309;color:#b45309}
.btn-dl{background:transparent;border:1.5px solid var(--bb);border-radius:var(--rm);padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer;font-family:var(--fs);color:var(--ts);display:inline-flex;align-items:center;gap:5px}
.btn-dl:hover{background:#fef2f2;border-color:#b91c1c;color:#b91c1c}
.act-btns{display:flex;gap:8px;flex-wrap:nowrap}
.add-inp-row{display:none;gap:4px;margin-top:6px;align-items:center}
.add-inp-row input{flex:1;padding:6px 10px;border-radius:var(--rm);border:1.5px solid var(--bb);font-size:13px;min-width:0;background:var(--bp);color:var(--tp)}
.sel-wrap{display:flex;flex-direction:column;flex:1 1 auto;min-width:76px}
.form-btns{display:flex;gap:8px;margin-top:16px}
.kind-toggle{display:flex;gap:6px;margin-bottom:16px;background:var(--bs);padding:4px;border-radius:var(--rm);width:fit-content}
.kt-btn{border:none;background:transparent;padding:6px 18px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ts);font-family:var(--fs)}
.kt-btn.active{background:var(--bp);color:var(--ti);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kt-btn:disabled{opacity:.45;cursor:default}
.sec-title{font-size:14px;font-weight:700;color:var(--tp);margin:4px 0 10px;display:flex;align-items:center;gap:7px}
.src-tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;background:var(--bi);color:var(--ti);white-space:nowrap}
.src-tag.indep{background:#fef3c7;color:#92400e}
@media(prefers-color-scheme:dark){.src-tag.indep{background:#4a3a1a;color:#fcd34d}}
.fit-card{background:var(--bs);border-radius:var(--rm);padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.fit-top{display:flex;gap:8px;align-items:center}
.port-group{background:var(--bp);border-radius:6px;padding:8px;border:1px solid var(--bt)}
.port-hdr{font-size:11px;font-weight:700;color:var(--ts);margin-bottom:6px;letter-spacing:.05em}
.port-fields{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.gender-fixed{padding:6px 10px;border-radius:var(--rm);border:1.5px solid var(--bt);font-size:13px;color:var(--ts);background:var(--bs);flex:0 0 auto;white-space:nowrap}
.fit-reveal{animation:fadeSlide .18s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
th{font-size:12px;font-weight:600;color:var(--ts);text-align:left;padding:0;border-bottom:1.5px solid var(--bb);white-space:nowrap;background:var(--bs)}
th:hover{color:var(--tp)}
.th-inner{display:flex;align-items:center;gap:4px;padding:8px 10px;white-space:nowrap}
.th-text{display:inline-flex;align-items:center;gap:2px}
th.r .th-inner{justify-content:flex-end}th.c .th-inner{justify-content:center}
td{padding:5px 8px;border-bottom:1px solid var(--bt);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bs)}
tr.hl td{background:var(--bi)!important}
.mono{font-family:var(--fm);font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ti);font-weight:500}
.num-c{text-align:right;font-family:var(--fm);font-weight:600;font-size:14px;white-space:nowrap}
.ctr{text-align:center;font-family:var(--fm);font-weight:600;font-size:13px}
.note-c{font-size:13px;color:var(--ts);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fit-c{font-size:12px;color:var(--ts);line-height:1.5;max-width:150px}
.stat-bar{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;font-size:13px;color:var(--ts)}
.stat-bar b{color:var(--tp);font-weight:600}
.vsep{width:1.5px;height:16px;background:var(--bt)}
.export-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--tt);margin-top:8px}
.danger-zone{margin-top:12px;padding-top:12px;border-top:1px solid var(--bt)}
.empty{text-align:center;padding:2.5rem;color:var(--tt);font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a4a6e;color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>現場需求紀錄</h1>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span id="hdr-count"></span>
    <span style="font-size:11px;font-weight:700;color:var(--tt);letter-spacing:.06em;padding:2px 8px;border:1px solid var(--bt);border-radius:20px">v3.0</span>
  </div>
</header>
<div style="margin-bottom:1rem">
  <label style="font-size:13px;font-weight:500;color:var(--ts);display:block;margin-bottom:5px">專案名稱</label>
  <input type="text" id="inp-project" class="inp-b" placeholder="輸入專案名稱" autocomplete="off" style="max-width:400px">
</div>

<div class="panel mode-new" id="form-panel">
  <div class="stitle"><span id="form-title-txt">新增紀錄</span><span class="mbadge mb-new" id="mode-badge">新增</span></div>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap">
    <button class="btn pri" id="btn-sub-top" type="button" style="padding:7px 14px;font-size:14px"><i class="ti ti-plus" id="ico-sub-top"></i></button>
    <div class="kind-toggle" id="kind-toggle" style="margin-bottom:0">
      <button type="button" class="kt-btn active" data-kind="hose">軟管需求</button>
      <button type="button" class="kt-btn" data-kind="conn">接頭需求</button>
    </div>
  </div>
  <div class="field hose-only"><span class="lbl">A 端</span><div id="mntA"></div><div class="preview">→ <span style="color:var(--ti)" id="pvA"></span></div></div>
  <div class="field hose-only"><span class="lbl">B 端</span><div id="mntB"></div><div class="preview">→ <span style="color:var(--ti)" id="pvB"></span></div></div>
  <div class="field hose-only"><span class="lbl">長度 (mm)</span><input type="number" id="inp-len" inputmode="numeric" class="inp-b" style="width:130px" autocomplete="off"></div>
  <div class="field hose-only">
    <span class="lbl">管徑 / 層數 / 工作壓力</span>
    <div class="spec-row">
      <div class="spec-item"><span class="lbl" style="font-size:12px;margin-bottom:3px">管徑</span><select id="inp-bore" class="ssel"></select></div>
      <div class="spec-item"><span class="lbl" style="font-size:12px;margin-bottom:3px">層數(可留空)</span><select id="inp-layers" class="ssel"></select></div>
      <div class="spec-item"><span class="lbl" style="font-size:12px;margin-bottom:3px">工作壓力(可留空) (BAR)</span><input type="number" id="inp-pressure" inputmode="numeric" class="inp-b" style="font-size:14px" autocomplete="off"></div>
    </div>
  </div>
  <div class="field hose-only"><span class="lbl">數量</span><input type="number" id="inp-qty" min="1" value="1" class="inp-b" style="width:100px"></div>
  <div class="field hose-only">
    <span class="lbl">端頭材質</span>
    <select id="inp-material" class="ssel" style="width:120px">
      <option value="鐵">鐵</option>
      <option value="不鏽鋼">不鏽鋼</option>
    </select>
  </div>
  <div class="field">
    <span class="lbl">搭配接頭</span>
    <div id="fittings-container"></div>
    <button class="btn add-fit sm" id="btn-add-fit" type="button" style="margin-top:4px"><i class="ti ti-plus"></i> 新增接頭</button>
  </div>
  <div class="field">
    <span class="lbl">編號 / 位置/功用/備註</span>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" id="inp-seq" class="inp-b" style="width:72px;flex:0 0 auto" placeholder="編號" autocomplete="off">
      <input type="text" id="inp-note" class="inp-b" autocomplete="off" style="flex:1">
    </div>
  </div>
  <div class="field hose-only" style="margin-bottom:0"><span class="lbl">說明(給廠商)</span><input type="text" id="inp-vendor" class="inp-b" autocomplete="off"></div>
  <div class="form-btns">
    <button class="btn pri" id="btn-sub"><i class="ti ti-plus" id="ico-sub"></i><span id="lbl-sub">新增</span></button>
    <button class="btn" id="btn-cancel" style="display:none"><i class="ti ti-x"></i> 取消</button>
  </div>
</div>

<div class="panel" id="tbl-panel" style="display:none">
  <div class="sec-title"><i class="ti ti-rotate-2"></i> 軟管清單 <button class="btn-cp" id="btn-copy-hose" type="button" style="margin-left:auto"><i class="ti ti-copy"></i> 複製軟管表</button></div>
  <div class="tbl-wrap"><table id="hose-table"><thead><tr id="hose-thead"></tr></thead><tbody id="hose-tbody"></tbody></table></div>
  <div class="sec-title" style="margin-top:24px"><i class="ti ti-plug-connected"></i> 接頭彙總清單 <button class="btn-cp" id="btn-copy-conn" type="button" style="margin-left:auto"><i class="ti ti-copy"></i> 複製接頭表</button></div>
  <div class="tbl-wrap"><table id="conn-table"><thead><tr id="conn-thead"></tr></thead><tbody id="conn-tbody"></tbody></table></div>
  <div class="stat-bar">軟管 <b id="sc">0</b> 筆<div class="vsep"></div>軟管總數 <b id="sq">0</b> 條<div class="vsep"></div>接頭 <b id="scn">0</b> 項</div>
  <div class="export-row">
    <button class="btn" id="btn-x-hose-full" style="color:#16a34a;border-color:#16a34a"><i class="ti ti-file-spreadsheet"></i> 軟管清單保存</button>
    <button class="btn" id="btn-x-hose-vendor" style="color:#b91c1c;border-color:#b91c1c"><i class="ti ti-file-spreadsheet"></i> 給廠商軟管清單</button>
    <button class="btn" id="btn-x-conn-full" style="color:#16a34a;border-color:#16a34a"><i class="ti ti-file-spreadsheet"></i> 接頭清單保存</button>
    <button class="btn" id="btn-x-conn-vendor" style="color:#b91c1c;border-color:#b91c1c"><i class="ti ti-file-spreadsheet"></i> 給廠商接頭清單</button>
  </div>
  <div class="hint">四個按鈕各下載一個 Excel（.xlsx），可直接開啟、框選複製、編修、歸檔；或用上方「複製表格」一鍵貼進 Excel。</div>
  <div class="danger-zone"><button class="btn danger" id="btn-clear-all"><i class="ti ti-trash-x"></i> 清空所有數據</button></div>
</div>

<div id="empty-msg" class="empty"><i class="ti ti-clipboard-list" style="font-size:28px;display:block;margin-bottom:8px"></i>尚無紀錄，填寫上方表單後新增</div>
<div id="toast" class="toast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js"></script>

<script>
// ── 接頭規格資料 ──────────────────────────────────────────────────
const SHAPES_CONFIG={
  '直接頭':{ports:['#1','#2']},
  '90度':{ports:['#1','#2']},
  '三通':{ports:['#1','#2','#3']},
  'BANJO':{ports:['#1','#2']},
  '穿艙':{ports:['#1','#2']},
  '45度':{ports:['#1','#2']}
};
const PORT_SPECS={
  Steel_Tube_Fitting:{name:'鋼管頭',genders:['公','母'],sizes:['6L','8L','10L','12L','15L','18L','22L','28L','35L','42L','6S','8S','10S','12S','14S','16S','20S','25S','30S','38S']},
  TH_Fitting:{name:'TH頭',genders:['公','母'],sizes:['1/8"','3/16"','1/4"','5/16"','3/8"','1/2"','5/8"','3/4"','7/8"','1"','1-1/4"','1-1/2"','2"']},
  PT_Thread:{name:'PT牙口',genders:null,sizes:['1/8"','1/4"','3/8"','1/2"','3/4"','1"','1-1/4"','1-1/2"','2"']},
  Metric_Port:{name:'公制牙口',genders:null,sizes:['M8x1','M10x1','M12x1.5','M14x1.5','M16x1.5','M18x1.5','M22x1.5','M27x2','M33x2','M42x2','M48x2','M60x2']},
  G_Thread:{name:'G牙口',genders:null,sizes:['1/8"','1/4"','3/8"','1/2"','5/8"','3/4"','1"','1-1/4"','1-1/2"','2"']},
  Insert_Fitting:{name:'插心',genders:null,sizes:['1/8"','3/16"','1/4"','5/16"','3/8"','1/2"','5/8"','3/4"','1"','1-1/4"','1-1/2"','2"']},
  Ball_Eye_Fitting:{name:'魚眼',genders:null,sizes:['M6','M8','M10','M12','M14','M16','M18','M20','M22','M24','M27','M30']}
};
const SHORT={Steel_Tube_Fitting:'鋼管頭',TH_Fitting:'TH',PT_Thread:'PT',Metric_Port:'公制',G_Thread:'G',Insert_Fitting:'插心',Ball_Eye_Fitting:'魚眼'};

// ── 軟管接頭/管徑常數 ─────────────────────────────────────────────
const TH_SZ=['1/8"','1/4"','3/8"','1/2"','3/4"','1"','1 1/4"','1 1/2"'];
const ST_SZ=['6L','8L','10L','12L','15L','18L','22L','8S','10S','12S','14S','16S','20S','25S'];
const BASE_TYPES=['母直','母90度','母45度'];
const BORE_OPT=['1/4','3/8','1/2','5/8','3/4','1"','1-1/4','1-1/2','2"'];
const BORE_LAYERS={'1/4':[1,2],'3/8':[1,2,4],'1/2':[1,2,4],'5/8':[1,2,4],'3/4':[1,2,4],'1"':[1,2,4],'1-1/4':[1,2,4],'1-1/2':[1,2,4],'2"':[1,2,4]};
const BORE_MAP={
  TH:{'1/8"':null,'1/4"':'1/4','3/8"':'3/8','1/2"':'1/2','3/4"':'3/4','1"':'1"','1 1/4"':'1-1/4','1 1/2"':'1-1/2'},
  ST:{'6L':'1/4','8L':'1/4','10L':'3/8','12L':'3/8','15L':'1/2','18L':'5/8','22L':'3/4','8S':'1/4','10S':'1/4','12S':'3/8','14S':'1/2','16S':'1/2','20S':'5/8','25S':'3/4'}
};
const custom={THSz:[],STSz:[],types:[]};
const COLS=[
  {key:'num',label:'編號',sortCol:null,w:'48px',align:'center'},
  {key:'a',label:'A 端',sortCol:'a'},
  {key:'b',label:'B 端',sortCol:'b'},
  {key:'len',label:'長度',sortCol:'len',w:'70px',align:'right'},
  {key:'bore',label:'管徑',sortCol:'bore',w:'56px'},
  {key:'layers',label:'層數',sortCol:'layers',w:'52px',align:'center'},
  {key:'pressure',label:'耐壓',sortCol:'pressure',w:'64px',align:'right'},
  {key:'qty',label:'數量',sortCol:'qty',w:'48px',align:'center'},
  {key:'material',label:'端頭材質',sortCol:'material',w:'64px',align:'center'},
  {key:'seq',label:'編號',sortCol:'seq',w:'52px',align:'center'},
  {key:'note',label:'位置/功用/備註',sortCol:'note'},
  {key:'vendor',label:'說明(給廠商)',sortCol:'vendor'}
];

// ── 持久化 ────────────────────────────────────────────────────────
const STORAGE_KEY='hose_measurement_v3';
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({records,nextId,custom,sessionDefaultPressure}));}catch(e){}}
function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!d)return;
    if(Array.isArray(d.records)){
      records=d.records;
      records.forEach(r=>{
        if(!r.kind)r.kind='hose';
        ['a','b'].forEach(k=>{if(r[k]&&typeof r[k].type==='string'&&r[k].type.endsWith('頭'))r[k].type=r[k].type.slice(0,-1);});
      });
    }
    if(d.nextId)nextId=d.nextId;
    if(d.custom){custom.THSz=d.custom.THSz||[];custom.STSz=d.custom.STSz||[];custom.types=d.custom.types||[];}

// 僅當小1號者規範為 TH頭 或 鋼管頭 時同步；大號 port 一旦已設定則不覆蓋（可自由改）
function cascadeFitDefault(f,fromIdx){
  const SYNC=['TH_Fitting','Steel_Tube_Fitting'];
  for(let i=Math.max(0,fromIdx);i<f.ports.length-1;i++){
    const from=f.ports[i],to=f.ports[i+1];
    if(from.spec&&SYNC.includes(from.spec)&&!to.spec){
      to.spec=from.spec;to.gender=from.gender;to.size=from.size;

  }
}

// 依軟管管徑推算接頭預設尺寸
function getSizeForBore(specKey,bore){
  if(!bore)return null;
  const sp=PORT_SPECS[specKey];if(!sp)return null;
  if(specKey==='Steel_Tube_Fitting'){return sp.sizes.find(s=>BORE_MAP.ST[s]===bore)||null;}
  const c=bore+'"';if(sp.sizes.includes(c))return c;
  if(sp.sizes.includes(bore))return bore;
  return null;
}
// 依軟管端頭規範匹配尺寸（#1 port 專用）
function getSizeFromEnd(specKey){
  if(currentKind!=='hose')return null;
  if(specKey==='TH_Fitting'){if(csA.cat==='TH')return csA.sz;if(csB.cat==='TH')return csB.sz;}
  else if(specKey==='Steel_Tube_Fitting'){if(csA.cat==='鋼管頭')return csA.sz;if(csB.cat==='鋼管頭')return csB.sz;}
  return null;
}
// 變更 port[fromIdx] 尺寸後，將同規範的後續 port 尺寸同步
function cascadeSizeFromPort(f,fromIdx){
  const from=f.ports[fromIdx];if(!from.spec)return false;
  let changed=false;
  for(let i=fromIdx+1;i<f.ports.length;i++){
    if(f.ports[i].spec===from.spec&&f.ports[i].size!==from.size){f.ports[i].size=from.size;changed=true;}
  }
  return changed;
}

    if(editId!==null){
      const r=records.find(x=>x.id===editId);
      if(r){r.kind='conn';r.fittings=fittings;r.note=note;r.seq=seq;delete r.a;delete r.b;delete r.len;}
      setEditMode(false);
    }else{
      records.push({id:nextId++,kind:'conn',fittings,note,seq});
    }
    resetForm();renderTable();saveState();return;
  }
  const len=parseInt(document.getElementById('inp-len').value);if(!len||len<=0){document.getElementById('inp-len').focus();return;}
  const qty=Math.max(1,parseInt(document.getElementById('inp-qty').value)||1);
  const material=document.getElementById('inp-material').value||'鐵';
  const spec=getSpec();const vendor=document.getElementById('inp-vendor').value.trim();
  if(editId!==null){
    const r=records.find(x=>x.id===editId);
    if(r){r.kind='hose';r.a={...csA};r.b={...csB};r.len=len;Object.assign(r,spec);r.qty=qty;r.material=material;r.note=note;r.vendor=vendor;r.fittings=fittings;r.seq=seq;}
    setEditMode(false);
  }else{
    records.push({id:nextId++,kind:'hose',a:{...csA},b:{...csB},len,...spec,qty,material,note,vendor,fittings,seq});
    if(!sessionDefaultPressure&&spec.pressure)sessionDefaultPressure=spec.pressure;
    lastFormState={csA:{...csA},csB:{...csB},bore:spec.bore,layers:spec.layers,pressure:spec.pressure,material};
  }
  resetForm();renderTable();saveState();
});

// ── 表格 ──────────────────────────────────────────────────────────
function sortedRecs(){
  const base=records.filter(r=>r.kind!=='conn');
  if(!sortCol)return base;
  return base.sort((a,b)=>{
    let av,bv;
    if(sortCol==='a'){av=buildLabel(a.a);bv=buildLabel(b.a);}else if(sortCol==='b'){av=buildLabel(a.b);bv=buildLabel(b.b);}
    else if(sortCol==='len'){av=a.len;bv=b.len;}else if(sortCol==='bore'){av=a.bore||'';bv=b.bore||'';}
    else if(sortCol==='layers'){av=a.layers||0;bv=b.layers||0;}else if(sortCol==='pressure'){av=a.pressure||0;bv=b.pressure||0;}
    else if(sortCol==='qty'){av=a.qty;bv=b.qty;}else if(sortCol==='note'){av=a.note||'';bv=b.note||'';}
    else{av=a.vendor||'';bv=b.vendor||'';}
    return(av<bv?-1:av>bv?1:0)*(sortDir==='asc'?1:-1);
  });
}
// 接頭彙總：軟管衍生（用於#n）＋ 獨立接頭紀錄
function buildConnRows(){
  const rows=[];

  records.filter(r=>r.kind==='conn').forEach(r=>{(r.fittings||[]).filter(f=>f.shape).forEach(f=>rows.push({spec:fittingSpec(f),qty:f.qty,material:f.material||'鐵',source:'獨立',note:r.note||'',indep:true,recId:r.id}));});
  return rows;
}

// 字串拆分：中文→標楷體，英數→Times New Roman
function toRichRuns(s,sz){
  if(!s)return null;const str=String(s);if(!str)return null;
  const runs=[];let cur='';let inCJK=null;
  for(const ch of str){
    const c=/[\u4e00-\u9fff\u3000-\u303f\u3400-\u4dbf\uf900-\ufaff\uff01-\uffee]/.test(ch);
    if(inCJK===null)inCJK=c;
    if(c!==inCJK){if(cur)runs.push({font:{name:inCJK?'標楷體':'Times New Roman',size:sz},text:cur});cur=ch;inCJK=c;}else cur+=ch;
  }
  if(cur)runs.push({font:{name:inCJK?'標楷體':'Times New Roman',size:sz},text:cur});
  return runs.length>1?{richText:runs}:null;
}
async function dlStyledXlsx(listTitle,aoa,filename){
  if(typeof ExcelJS==='undefined'){showToast('Excel 套件未載入（需連網）');return;}
  if(aoa.length<=1){showToast('清單為空，無法匯出');return;}
  const wb=new ExcelJS.Workbook();wb.creator='HoseApp v3.0';
  const ws=wb.addWorksheet(listTitle);
  const nc=aoa[0].length;const dt=dateTimeStr();
  const projName=document.getElementById('inp-project')?.value.trim()||'';
  const titleText=projName?projName+' '+listTitle:listTitle;
  // 第1列：標題 18pt 粗體 置中
  ws.addRow([titleText]);ws.mergeCells(1,1,1,nc);
  const r1c1=ws.getCell(1,1);r1c1.value=titleText;
  r1c1.font={name:'標楷體',size:18,bold:true};r1c1.alignment={horizontal:'center',vertical:'middle'};ws.getRow(1).height=32;
  // 第2列：日期 12pt 水平靠左 垂直置中
  ws.addRow(['建檔日期：'+dt]);ws.mergeCells(2,1,2,nc);
  const r2c1=ws.getCell(2,1);r2c1.value='建檔日期：'+dt;
  r2c1.font={name:'標楷體',size:12};r2c1.alignment={horizontal:'left',vertical:'middle'};ws.getRow(2).height=20;
  // 第3列：欄位頭 12pt 水平垂直置中
  ws.addRow(aoa[0]);
  ws.getRow(3).eachCell({includeEmpty:true},(cell,col)=>{
    if(col>nc)return;
    cell.font={name:'標楷體',size:12,bold:true};cell.alignment={horizontal:'center',vertical:'middle'};
    cell.border={bottom:{style:'thin',color:{argb:'FF888888'}}};
  });ws.getRow(3).height=20;
  // 第4列起：內容 12pt 靠左（混排）
  aoa.slice(1).forEach(rowData=>{
    const row=ws.addRow(rowData.map(v=>v==null?'':v));
    row.eachCell({includeEmpty:true},(cell,col)=>{
      if(col>nc)return;
      const v=cell.value;
      if(typeof v==='number'){cell.font={name:'Times New Roman',size:12};}
      else{
        const str=String(v==null?'':v);
        const rich=toRichRuns(str,12);
        if(rich){cell.value=rich;}else{cell.font={name:/[\u4e00-\u9fff]/.test(str)?'標楷體':'Times New Roman',size:12};}
      }
      cell.alignment={horizontal:'left',vertical:'middle',wrapText:true};
    });
  });
  // 自動調整欄寬
  ws.columns=aoa[0].map((_,ci)=>{
    const maxLen=Math.max(...aoa.map(r=>String(r[ci]==null?'':r[ci]).length));
    return{width:Math.min(Math.max(maxLen*1.6,10),55)};
  });
  // 自動調整列高（第4列起）
  ws.eachRow((row,rn)=>{
    if(rn<=3)return;
    let maxLines=1;
    row.eachCell({includeEmpty:false},cell=>{
      const txt=String(cell.value==null?'':cell.value);
      const lines=txt.split('\n').length;
      if(lines>maxLines)maxLines=lines;
    });
    row.height=Math.max(16,maxLines*16);
  });
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function copyAoa(aoa){
  if(aoa.length<=1){showToast('清單為空');return;}
  const html='<table border="1" style="border-collapse:collapse">'+aoa.map((row,ri)=>'<tr>'+row.map(c=>{const t=esc(String(c==null?'':c)).replace(/\n/g,'<br>');return ri===0?`<th>${t}</th>`:`<td>${t}</td>`;}).join('')+'</tr>').join('')+'</table>';
  const tsv=aoa.map(row=>row.map(c=>String(c==null?'':c).replace(/\n/g,' / ').replace(/\t/g,' ')).join('\t')).join('\n');
  try{
    await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([tsv],{type:'text/plain'})})]);
    showToast('✓ 已複製，貼到 Excel 即成表格');
  }catch(e){
    try{await navigator.clipboard.writeText(tsv);showToast('✓ 已複製（純文字 Tab 分隔）');}
    catch(_){showToast('複製失敗，請改用匯出按鈕');}
  }
}
