<!DOCTYPE html>
<!-- Version: v4.0 - Issac - 2026-06-16 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>現場需求紀錄 v4.0</title>
<style>
:root{
  --fs:system-ui,-apple-system,sans-serif;--fm:'Menlo','Consolas',monospace;
  --tp:#1a1410;--ts:#4a4540;--tt:#7a746e;--ti:#1a5c8a;--td:#b91c1c;
  --bp:#fdf8f2;--bs:#f0e8de;--bi:#dceefb;
  --bt:rgba(30,20,10,0.18);--bb:rgba(30,20,10,0.35);
  --rm:8px;--rl:12px;--pb:#e8e0d6;
}
@media(prefers-color-scheme:dark){:root{
  --tp:#f5f0e8;--ts:#c0b8ae;--tt:#857e76;--ti:#7dc4f0;--td:#f87171;
  --bp:#2a2520;--bs:#3a342e;--bi:#1a3a52;
  --bt:rgba(245,240,232,0.15);--bb:rgba(245,240,232,0.3);--pb:#1c1814;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--pb);min-height:100%}
body{font-family:var(--fs);font-size:15px;color:var(--tp)}
select,input{font-family:var(--fs);color:var(--tp);background:var(--bp)}
#inp-len::-webkit-inner-spin-button,#inp-len::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#inp-len{-moz-appearance:textfield;appearance:textfield}
#app{max-width:720px;margin:0 auto;padding:0.75rem}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.35rem;flex-wrap:nowrap;gap:0}
header h1{font-size:20px;font-weight:600;flex:1;text-align:left}
header span{flex:0 0 auto;font-size:11px;font-weight:700;color:var(--tt);letter-spacing:.06em;padding:2px 8px;border:1px solid var(--bt);border-radius:20px;line-height:1}
.panel{background:var(--bp);border:1px solid var(--bt);border-radius:var(--rl);padding:0.75rem 1rem;margin-bottom:0.75rem;box-shadow:0 1px 4px rgba(30,20,10,0.08);transition:border .2s}
.panel.mode-new{border:3px solid #2563eb}
.panel.mode-edit{border:3px solid #c0392b}
.stitle{font-size:12px;font-weight:600;color:var(--ts);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.mbadge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.mb-new{background:#dbeafe;color:#1d4ed8}.mb-edit{background:#fee2e2;color:#b91c1c}
.lbl{font-size:13px;font-weight:500;color:var(--ts);margin-bottom:3px;display:block}
.preview{font-size:13px;color:var(--tt);margin-top:4px;font-family:var(--fm);min-height:16px;word-break:break-all}
.field{margin-bottom:9px}
.conn-row{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.ssel{padding:5px 3px;border-radius:var(--rm);border:1.5px solid var(--bb);font-size:14px;flex:1 1 auto;min-width:0;max-width:100%;background:var(--bp);color:var(--tp);width:auto}
.ssel:focus{outline:2px solid var(--ti);outline-offset:1px}
.ssel:disabled{opacity:.4}
.inp-b{padding:6px 10px;border-radius:var(--rm);border:1.5px solid var(--bb);font-size:15px;background:var(--bp);color:var(--tp);width:100%}
.inp-b:focus{outline:2px solid var(--ti);outline-offset:1px}
.spec-row{display:flex;gap:5px;flex-wrap:nowrap}
.spec-item{display:flex;flex-direction:column;gap:2px;flex:1 1 0;min-width:0}
.spec-item .ssel{min-width:0;width:100%}
.btn{background:transparent;border:1.5px solid var(--bb);border-radius:var(--rm);padding:8px 16px;font-size:14px;cursor:pointer;color:var(--tp);display:inline-flex;align-items:center;gap:7px;font-family:var(--fs);white-space:nowrap;font-weight:500}
.btn:hover{background:var(--bs)}.btn:active{transform:scale(.98)}
.btn.pri{background:#1a4a6e;color:#fff;border-color:#1a4a6e}.btn.pri:hover{background:#15405f}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.add-fit{border-style:dashed;color:var(--ti);border-color:var(--ti)}
.btn.danger{color:var(--td);border-color:var(--td)}.btn.danger:hover{background:#fef2f2}
.btn-cp{background:transparent;border:1.5px solid var(--bb);border-radius:var(--rm);padding:4px 9px;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--fs);color:var(--ts);display:inline-flex;align-items:center;gap:4px}
.btn-cp:hover{background:#e8f4fd;border-color:#1a5c8a;color:#1a5c8a}
.btn-ed{background:transparent;border:1.5px solid var(--bb);border-radius:var(--rm);padding:4px 9px;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--fs);color:var(--ts);display:inline-flex;align-items:center;gap:4px}
.btn-ed:hover{background:#fff7e6;border-color:#b45309;color:#b45309}
.btn-dl{background:transparent;border:1.5px solid var(--bb);border-radius:var(--rm);padding:4px 9px;font-size:15px;font-weight:500;cursor:pointer;font-family:var(--fs);color:var(--ts);display:inline-flex;align-items:center;gap:4px}
.btn-dl:hover{background:#fef2f2;border-color:#b91c1c;color:#b91c1c}
.act-btns{display:flex;gap:4px;flex-wrap:nowrap}
.add-inp-row{display:none;gap:4px;margin-top:6px;align-items:center}
.add-inp-row input{flex:1;padding:6px 10px;border-radius:var(--rm);border:1.5px solid var(--bb);font-size:13px;min-width:0;background:var(--bp);color:var(--tp)}
.sel-wrap{display:flex;flex-direction:column;flex:1 1 auto;min-width:76px}
.form-btns{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
.kind-toggle{display:flex;gap:4px;margin-bottom:10px;background:var(--bs);padding:3px;border-radius:var(--rm);width:fit-content}
.kt-btn{border:none;background:transparent;padding:6px 18px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ts);font-family:var(--fs)}
.kt-btn.active{background:var(--bp);color:var(--ti);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.kt-btn:disabled{opacity:.45;cursor:default}
.sec-title{font-size:14px;font-weight:700;color:var(--tp);margin:4px 0 10px;display:flex;align-items:center;gap:7px}
.src-tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;background:var(--bi);color:var(--ti);white-space:nowrap}
.src-tag.indep{background:#fef3c7;color:#92400e}
@media(prefers-color-scheme:dark){.src-tag.indep{background:#4a3a1a;color:#fcd34d}}
.fit-card{background:var(--bs);border-radius:var(--rm);padding:8px;margin-bottom:6px;display:flex;flex-direction:column;gap:6px}
.fit-top{display:flex;gap:8px;align-items:center}
.port-group{background:var(--bp);border-radius:6px;padding:8px;border:1px solid var(--bt);display:flex;align-items:center;gap:8px}
.port-hdr{font-size:12px;font-weight:700;color:var(--ts);margin-bottom:0;letter-spacing:.05em;flex:0 0 auto;white-space:nowrap}
.port-fields{display:flex;gap:5px;flex-wrap:wrap;align-items:center;flex:1;min-width:0}
.gender-fixed{padding:6px 10px;border-radius:var(--rm);border:1.5px solid var(--bt);font-size:13px;color:var(--ts);background:var(--bs);flex:0 0 auto;white-space:nowrap}
.fit-reveal{animation:fadeSlide .18s ease}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:0;table-layout:auto}
th{font-size:12px;font-weight:600;color:var(--ts);text-align:left;padding:0;border-bottom:1.5px solid var(--bb);white-space:nowrap;background:var(--bs)}
th:hover{color:var(--tp)}
.th-inner{display:flex;align-items:center;gap:4px;padding:5px 8px;white-space:nowrap}
.th-text{display:inline-flex;align-items:center;gap:2px}
th.r .th-inner{justify-content:flex-end}th.c .th-inner{justify-content:center}
td{padding:3px 6px;border-bottom:1px solid var(--bt);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bs)}
tr.hl td{background:var(--bi)!important}
.mono{font-family:var(--fm);font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ti);font-weight:500}
.num-c{text-align:right;font-family:var(--fm);font-weight:600;font-size:14px;white-space:nowrap}
.ctr{text-align:center;font-family:var(--fm);font-weight:600;font-size:13px}
.note-c{font-size:13px;color:var(--ts);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fit-c{font-size:12px;color:var(--ts);line-height:1.5;max-width:150px}
.stat-bar{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;font-size:13px;color:var(--ts)}
.stat-bar b{color:var(--tp);font-weight:600}
.vsep{width:1.5px;height:16px;background:var(--bt)}
.export-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--tt);margin-top:8px}
.danger-zone{margin-top:12px;padding-top:12px;border-top:1px solid var(--bt)}
.empty{text-align:center;padding:2.5rem;color:var(--tt);font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a4a6e;color:#fff;padding:10px 22px;border-radius:20px;font-size:14px;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.tab-nav{display:flex;background:var(--bs);padding:3px;border-radius:var(--rm);margin-bottom:0.75rem;gap:3px;overflow-x:visible}
.tab-btn{flex:1;background:transparent;border:none;border-radius:6px;padding:7px 0;font-size:14px;font-weight:600;cursor:pointer;color:var(--ts);text-align:center;font-family:var(--fs);margin-bottom:0}
.tab-btn.active{background:var(--bp);color:var(--ti);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tab-page{display:none}
.tab-page.active{display:block}
.inline-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.inline-row .lbl{margin-bottom:0;flex:0 0 auto;white-space:nowrap}
.qty-mat-row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.qty-mat-row>div{display:flex;flex-direction:column;gap:2px}
</style>
</head>
<body>
<div id="app">
<header>
  <h1>現場需求紀錄</h1>
  <span>v4.0</span>
</header>

<div style="display:flex;align-items:center;gap:8px;margin-bottom:0.75rem">
  <label style="font-size:13px;font-weight:500;color:var(--ts);white-space:nowrap;flex:0 0 auto">專案名稱</label>
  <input type="text" id="inp-project" class="inp-b" placeholder="輸入專案名稱" autocomplete="off" style="max-width:400px;flex:1">
</div>

<nav class="tab-nav">
  <button class="tab-btn active" data-tab="main">需求紀錄</button>
  <button class="tab-btn" data-tab="others">其他需求</button>
  <button class="tab-btn" data-tab="memo">備忘</button>
</nav>

<!-- ── 需求紀錄頁面 ── -->
<div id="tab-main" class="tab-page active">

<div class="panel mode-new" id="form-panel">
  <div class="stitle">
    <span class="mbadge mb-new" id="mode-badge">新增</span>
    <span id="stitle-main-count" style="margin-left:auto;font-size:14px;color:var(--ts);text-transform:none;letter-spacing:0;font-weight:500">0 筆</span>
  </div>
  <div class="kind-toggle" id="kind-toggle">
    <button type="button" class="kt-btn active" data-kind="hose">軟管需求</button>
    <button type="button" class="kt-btn" data-kind="conn">接頭需求</button>
  </div>

  <!-- A端 B端 -->
  <div class="field hose-only"><div style="display:flex;align-items:center;gap:8px"><span class="lbl" style="margin-bottom:0;flex:0 0 auto">A 端</span><div id="mntA" style="flex:1;min-width:0"></div></div></div>
  <div class="field hose-only"><div style="display:flex;align-items:center;gap:8px"><span class="lbl" style="margin-bottom:0;flex:0 0 auto">B 端</span><div id="mntB" style="flex:1;min-width:0"></div></div></div>

  <!-- 長度 - inline -->
  <div class="inline-row hose-only">
    <span class="lbl">長度 (mm)</span>
    <input type="number" id="inp-len" inputmode="numeric" class="inp-b" style="width:130px;flex:0 0 auto" autocomplete="off">
  </div>

  <!-- 管徑 / 層數 / 工作壓力 - 無外層標題 -->
  <div class="field hose-only">
    <div class="spec-row">
      <div class="spec-item"><span class="lbl" style="font-size:12px;margin-bottom:3px">管徑</span><select id="inp-bore" class="ssel"></select></div>
      <div class="spec-item"><span class="lbl" style="font-size:12px;margin-bottom:3px">層數</span><select id="inp-layers" class="ssel"></select></div>
      <div class="spec-item"><span class="lbl" style="font-size:12px;margin-bottom:3px">耐壓 (BAR)</span><input type="number" id="inp-pressure" inputmode="numeric" class="inp-b" style="font-size:14px" autocomplete="off"></div>
    </div>
  </div>

  <!-- 數量 + 端頭材質 + 廠牌 - 同列 -->
  <div class="field hose-only">
    <div class="qty-mat-row">
      <div>
        <span class="lbl">數量</span>
        <input type="number" id="inp-qty" min="1" value="1" class="inp-b" style="width:80px">
      </div>
      <div>
        <span class="lbl">端頭材質</span>
        <select id="inp-material" class="ssel" style="width:100px">
          <option value="鐵">鐵</option>
          <option value="不鏽鋼">不鏽鋼</option>
        </select>
      </div>
      <div>
        <span class="lbl">廠牌</span>
        <select id="inp-brand" class="ssel" style="width:110px">
          <option value="-">-</option>
          <option value="Parker">Parker</option>
          <option value="Aeroquip">Aeroquip</option>
          <option value="常規品">常規品</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 編號 + 位置/功用/備註 — 初始置於 hose 位置（vendor 之前），conn 模式時由 JS 移至 kind-toggle 之後 -->
  <div class="field" id="note-seq-field">
    <div style="display:flex;gap:8px;align-items:flex-start">
      <div id="seq-wrap" style="flex:0 0 auto">
        <span class="lbl">編號</span>
        <input type="text" id="inp-seq" class="inp-b" style="width:72px" placeholder="編號" autocomplete="off">
      </div>
      <div id="note-wrap" style="flex:1;min-width:0">
        <span class="lbl" id="note-lbl">位置/功用/備註</span>
        <input type="text" id="inp-note" class="inp-b" autocomplete="off">
      </div>
    </div>
  </div>

  <!-- 說明(給廠商) -->
  <div class="field hose-only" id="vendor-field" style="margin-bottom:0">
    <span class="lbl">說明(給廠商)</span>
    <input type="text" id="inp-vendor" class="inp-b" autocomplete="off">
  </div>

  <!-- 搭配接頭 - 移到說明之後 -->
  <div class="field" id="fittings-field">
    <div id="fittings-container"></div>
    <button class="btn add-fit sm" id="btn-add-fit" type="button" style="margin-top:4px">＋ 新增接頭</button>
  </div>

  <!-- 表單按鈕：靠右，取消在左，儲存/加到清單在最右 -->
  <div class="form-btns">
    <button class="btn" id="btn-cancel" style="display:none">✕ 取消</button>
    <button class="btn pri" id="btn-sub"><span id="ico-sub">＋</span><span id="lbl-sub">加到清單</span></button>
  </div>
</div>

<div class="panel" id="tbl-panel" style="display:none">
  <div class="sec-title">⟳ 軟管清單 <button class="btn-cp" id="btn-copy-hose" type="button" style="margin-left:auto">⎘ 複製到剪貼簿</button></div>
  <div class="tbl-wrap"><table id="hose-table"><thead><tr id="hose-thead"></tr></thead><tbody id="hose-tbody"></tbody></table></div>
  <div style="margin-top:8px">
    <span class="lbl">軟管清單說明（隨「給廠商軟管清單」匯出）</span>
    <textarea id="hose-note" class="inp-b" rows="2" style="resize:vertical" autocomplete="off"></textarea>
  </div>
  <div class="sec-title" style="margin-top:20px">⟐ 接頭清單 <button class="btn-cp" id="btn-copy-conn" type="button" style="margin-left:auto">⎘ 複製到剪貼簿</button></div>
  <div class="tbl-wrap"><table id="conn-table"><thead><tr id="conn-thead"></tr></thead><tbody id="conn-tbody"></tbody></table></div>
  <div style="margin-top:8px">
    <span class="lbl">接頭清單說明（隨「給廠商接頭清單」匯出）</span>
    <textarea id="conn-note" class="inp-b" rows="2" style="resize:vertical" autocomplete="off"></textarea>
  </div>
  <div class="stat-bar">軟管 <b id="sc">0</b> 筆<div class="vsep"></div>軟管總數 <b id="sq">0</b> 條<div class="vsep"></div>接頭 <b id="scn">0</b> 項</div>
  <div class="export-row">
    <button class="btn" id="btn-x-hose-full" style="color:#16a34a;border-color:#16a34a">⬇ 軟管清單保存</button>
    <button class="btn" id="btn-x-hose-vendor" style="color:#b91c1c;border-color:#b91c1c">⬇ 給廠商軟管清單</button>
    <button class="btn" id="btn-x-conn-full" style="color:#16a34a;border-color:#16a34a">⬇ 接頭清單保存</button>
    <button class="btn" id="btn-x-conn-vendor" style="color:#b91c1c;border-color:#b91c1c">⬇ 給廠商接頭清單</button>
  </div>
  <div class="hint">四個按鈕各下載一個 Excel（.xlsx），可直接開啟、框選複製、編修、歸檔；或用上方「複製到剪貼簿」一鍵貼進 Excel。</div>
  <div class="danger-zone"><button class="btn danger" id="btn-clear-all">✕ 清空所有數據</button></div>
</div>

<div id="empty-msg" class="empty"><span style="font-size:28px;display:block;margin-bottom:8px">📋</span>尚無紀錄，填寫上方表單後新增</div>
</div><!-- end tab-main -->

<!-- ── 其他需求頁面 ── -->
<div id="tab-others" class="tab-page">
  <div class="panel mode-new" id="others-form-panel">
    <div class="stitle">
      <span class="mbadge mb-new" id="others-mode-badge">新增</span>
      <span id="stitle-oth-count" style="margin-left:auto;font-size:14px;color:var(--ts);text-transform:none;letter-spacing:0;font-weight:500">0 筆</span>
    </div>
    <div class="inline-row">
      <span class="lbl">品名</span>
      <input type="text" id="oth-name" class="inp-b" autocomplete="off" style="flex:1;min-width:0">
      <span class="lbl">數量</span>
      <input type="number" id="oth-qty" min="1" value="1" class="inp-b" style="width:90px;flex:0 0 auto">
    </div>
    <div class="inline-row">
      <span class="lbl">用途</span>
      <input type="text" id="oth-usage" class="inp-b" autocomplete="off">
    </div>
    <div class="form-btns">
      <button class="btn" id="oth-cancel" style="display:none">✕ 取消</button>
      <button class="btn pri" id="oth-sub"><span id="oth-ico">＋</span><span id="oth-lbl">加到清單</span></button>
    </div>
  </div>
  <div class="panel" id="oth-list-panel" style="display:none">
    <div class="sec-title">其他需求清單</div>
    <div class="tbl-wrap"><table id="oth-table"><thead><tr id="oth-thead"></tr></thead><tbody id="oth-tbody"></tbody></table></div>
    <div class="export-row">
      <button class="btn" id="oth-x-full" style="color:#16a34a;border-color:#16a34a">⬇ 其他需求清單保存</button>
    </div>
    <div class="danger-zone"><button class="btn danger" id="oth-clear">✕ 清空其他需求</button></div>
  </div>
  <div id="oth-empty" class="empty">尚無其他需求紀錄</div>
</div>

<!-- ── 備忘頁面 ── -->
<div id="tab-memo" class="tab-page">
  <div class="panel mode-new" id="memo-form-panel">
    <div class="stitle">
      <span class="mbadge mb-new" id="memo-mode-badge">新增</span>
      <span id="stitle-mem-count" style="margin-left:auto;font-size:14px;color:var(--ts);text-transform:none;letter-spacing:0;font-weight:500">0 筆</span>
    </div>
    <div class="field">
      <span class="lbl">內容</span>
      <textarea id="mem-content" class="inp-b" rows="3" style="resize:vertical" autocomplete="off"></textarea>
    </div>
    <div class="form-btns">
      <button class="btn" id="mem-cancel" style="display:none">✕ 取消</button>
      <button class="btn pri" id="mem-sub"><span id="mem-ico">＋</span><span id="mem-lbl">加到清單</span></button>
    </div>
  </div>
  <div class="panel" id="mem-list-panel" style="display:none">

<script>
// ── 接頭規格資料 ──────────────────────────────────────────────────
const SHAPES_CONFIG={

  '90度':{ports:['端1','端2']},
  '三通':{ports:['端1','端2','端3']},

};
const PORT_SPECS={
  Steel_Tube_Fitting:{name:'鋼管頭',genders:['公','母'],sizes:['6L','8L','10L','12L','15L','18L','22L','28L','35L','42L','6S','8S','10S','12S','14S','16S','20S','25S','30S','38S']},
  TH_Fitting:{name:'TH頭',genders:['公','母'],sizes:['1/8"','3/16"','1/4"','5/16"','3/8"','1/2"','5/8"','3/4"','7/8"','1"','1-1/4"','1-1/2"','2"']},

  Metric_Port:{name:'公制牙口',genders:null,sizes:['M8x1','M10x1','M12x1.5','M14x1.5','M16x1.5','M18x1.5','M22x1.5','M27x2','M33x2','M42x2','M48x2','M60x2']},
  G_Thread:{name:'G牙口',genders:null,sizes:['1/8"','1/4"','3/8"','1/2"','5/8"','3/4"','1"','1-1/4"','1-1/2"','2"']},
  Insert_Fitting:{name:'插心',genders:null,sizes:['1/8"','3/16"','1/4"','5/16"','3/8"','1/2"','5/8"','3/4"','1"','1-1/4"','1-1/2"','2"']}

const PLUG_SPECS=['Steel_Tube_Fitting','TH_Fitting','PT_Thread','Metric_Port','G_Thread'];
// 魚眼端1：規範類型 -> 尺寸（已移除括號銅圈標註）
const BALL_EYE_SIZES_BY_NORM={
  'M牙':['M8×1.0','M10×1.0','M10×1.25','M12×1.25','M12×1.5','M14×1.5','M16×1.5','M18×1.5','M22×1.5'],
  'G牙':['G 1/8"','G 1/4"','G 3/8"','G 1/2"','G 3/4"'],
  'UNF牙':['3/8"-24 UNF','7/16"-20 UNF','9/16"-18 UNF','3/4"-16 UNF','7/8"-14 UNF']
};
const BALL_EYE_NORMS=Object.keys(BALL_EYE_SIZES_BY_NORM);
function ballEyeE1Out(sz){return String(sz||'').trim();}
// 端口規範限制：直接頭/90度 端1∈{PT,公制,G} → 端2限{PT,鋼管頭,TH}；BANJO 端1限{PT,公制,G}、端2限{鋼管頭,TH}
const THREAD_SET=['PT_Thread','Metric_Port','G_Thread']; // 判定用：螺紋型集合（PT 保留）
const BANJO_E1_SPECS=['Metric_Port','G_Thread'];       // 變更2：BANJO 端1 規範（已刪 PT）
function allowedSpecsFor(f,pi){
  if(f.shape==='穿艙')return['Steel_Tube_Fitting','TH_Fitting'];
  if(f.shape==='塞頭')return PLUG_SPECS;
  if(f.shape==='魚眼'){return pi===0?null:['TH_Fitting'];}
  if(f.shape==='BANJO')return pi===0?BANJO_E1_SPECS:['Steel_Tube_Fitting','TH_Fitting'];
  if((f.shape==='直接頭'||f.shape==='90度')&&pi===1){
    const e1=(f.ports[0]||{}).spec;
    if(e1&&THREAD_SET.includes(e1))return['PT_Thread','Steel_Tube_Fitting','TH_Fitting'];
  }
  return Object.keys(PORT_SPECS);
}

// ── 軟管接頭/管徑常數 ─────────────────────────────────────────────
const TH_SZ=['1/8"','1/4"','3/8"','1/2"','3/4"','1"','1-1/4"','1-1/2"'];
const ST_SZ=['6L','8L','10L','12L','15L','18L','22L','8S','10S','12S','14S','16S','20S','25S'];
const BASE_TYPES=['母直','母90度','母45度'];
const BORE_OPT=['1/4','3/8','1/2','5/8','3/4','1"','1-1/4','1-1/2','2"'];
const BORE_LAYERS={'1/4':[1,2],'3/8':[1,2,4],'1/2':[1,2,4],'5/8':[1,2,4],'3/4':[1,2,4],'1"':[1,2,4],'1-1/4':[1,2,4],'1-1/2':[1,2,4],'2"':[1,2,4]};
const BORE_MAP={
  TH:{'1/8"':null,'1/4"':'1/4','3/8"':'3/8','1/2"':'1/2','3/4"':'3/4','1"':'1"','1-1/4"':'1-1/4','1-1/2"':'1-1/2'},
  ST:{'6L':'1/4','8L':'1/4','10L':'3/8','12L':'3/8','15L':'1/2','18L':'5/8','22L':'3/4','8S':'1/4','10S':'1/4','12S':'3/8','14S':'1/2','16S':'1/2','20S':'5/8','25S':'3/4'}
};
const custom={THSz:[],STSz:[],types:[]};

// COLS：移除 w 固定寬度，讓瀏覽器自動欄寬
const COLS=[
  {key:'vchk', label:'給廠商',      sortCol:null,    align:'center'},
  {key:'num',  label:'項次',        sortCol:null,    align:'center'},
  {key:'a',    label:'A 端',        sortCol:'a'},
  {key:'b',    label:'B 端',        sortCol:'b'},

  {key:'brand',label:'廠牌',        sortCol:'brand', align:'center'},
  {key:'seq',  label:'編號',        sortCol:'seq',   align:'center'},

];

// ── 持久化 ────────────────────────────────────────────────────────
const STORAGE_KEY='hose_measurement_v3';
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({
    records,nextId,custom,sessionDefaultPressure,sessionDefaultBrand,
    others,nextOthId,memos,nextMemId,hoseListNote,connListNote
  }));}catch(e){}
}
function loadState(){
  try{
    const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!d)return;
    if(Array.isArray(d.records)){
      records=d.records;
      records.forEach(r=>{
        if(!r.kind)r.kind='hose';
        ['a','b'].forEach(k=>{
          const c=r[k];if(!c)return;
          if((c.cat==='TH'||c.cat==='鋼管頭')&&typeof c.type==='string'&&c.type.endsWith('頭'))c.type=c.type.slice(0,-1);
          if(c.cat==='TH'&&typeof c.sz==='string')c.sz=c.sz.replace('1 1/4"','1-1/4"').replace('1 1/2"','1-1/2"'); // D 遷移
        });
        (r.fittings||[]).forEach(f=>{ // 變更4 遷移：魚眼端1 補 normType、去括號
          if(f.shape!=='魚眼')return;const p1=(f.ports||[])[0];
          if(p1&&p1.spec==='_BallEyeE1'&&!p1.normType){
            const s=String(p1.size||'').replace(/\s*\([^)]*\)\s*$/,'').trim().replace(/\s*×\s*/g,'×');
            p1.normType=/UNF/.test(s)?'UNF牙':(/^G/.test(s)?'G牙':'M牙');p1.size=s;
          }
        });
      });
    }
    if(d.nextId)nextId=d.nextId;
    if(d.custom){custom.THSz=d.custom.THSz||[];custom.STSz=d.custom.STSz||[];custom.types=d.custom.types||[];}
    if(d.sessionDefaultPressure!==undefined)sessionDefaultPressure=d.sessionDefaultPressure;
    if(d.sessionDefaultBrand!==undefined)sessionDefaultBrand=d.sessionDefaultBrand;
    if(Array.isArray(d.others))others=d.others;
    if(d.nextOthId)nextOthId=d.nextOthId;
    if(Array.isArray(d.memos))memos=d.memos;
    if(d.nextMemId)nextMemId=d.nextMemId;
    if(d.hoseListNote!==undefined)hoseListNote=d.hoseListNote;
    if(d.connListNote!==undefined)connListNote=d.connListNote;
  }catch(e){}
}

// ── Connector 工具 ────────────────────────────────────────────────
const isDirect=t=>t.endsWith('直');
function buildLabel(s){
  if(s.cat==='無壓接')return'無';
  if(s.cat==='其他'){
    const base=[s.spec,s.sz].map(x=>String(x==null?'':x).trim()).filter(Boolean).join(' ');
    const t=s.type||'';
    const str=((base?base+' ':'')+t).trim()+(t&&!isDirect(t)&&s.dir==='反向'?'(反向)':'');
    return str||'其他';
  }
  const p=s.cat==='TH'?'TH'+s.sz:s.sz;if(isDirect(s.type))return p+s.type;return p+s.type+(s.dir==='反向'?'(反向)':'');
}
function boreFromConn(cs){if(cs.cat==='TH')return BORE_MAP.TH[cs.sz]||null;if(cs.cat==='鋼管頭')return BORE_MAP.ST[cs.sz]||null;return null;}
function hasOpt(sel,val){for(const o of sel.options)if(o.value===val)return true;return false;}
function addOptToSel(sel,val){if(hasOpt(sel,val))return;const a=sel.querySelector('option[value="__ADD__"]');const o=document.createElement('option');o.value=val;o.textContent=val;if(a)sel.insertBefore(o,a);else sel.appendChild(o);}
let skipBoreUpdate=false;
function updPv(cs,pvId){
  const el=document.getElementById(pvId);if(el)el.textContent=buildLabel(cs);
  if(cs===csA&&!skipBoreUpdate&&(csA.cat==='TH'||csA.cat==='鋼管頭')){const bore=boreFromConn(csA);document.getElementById('inp-bore').value=bore||'';rebuildLayers(bore);}
}
function mkSelWrap(opts,customArr,val,onchange,catKey){
  const wrap=document.createElement('div');wrap.className='sel-wrap';
  const sel=document.createElement('select');sel.className='ssel';
  if(catKey)sel.dataset.cat=catKey;
  const allOpts=[...opts,...customArr];if(val&&!allOpts.includes(val))allOpts.unshift(val);
  allOpts.forEach(o=>{const op=document.createElement('option');op.value=o;op.textContent=o;if(o===val)op.selected=true;sel.appendChild(op);});
  const addOpt=document.createElement('option');addOpt.value='__ADD__';addOpt.textContent='＋ 新增項目…';sel.appendChild(addOpt);
  const aRow=document.createElement('div');aRow.className='add-inp-row';
  const aInp=document.createElement('input');aInp.type='text';aInp.placeholder='輸入後按 Enter 確認';
  const xBtn=document.createElement('button');xBtn.className='btn sm';xBtn.type='button';xBtn.textContent='✕';
  aRow.appendChild(aInp);aRow.appendChild(xBtn);
  let prev=val;
  sel.addEventListener('change',e=>{if(e.target.value==='__ADD__'){sel.value=prev;aRow.style.display='flex';aInp.focus();}else{prev=e.target.value;aRow.style.display='none';onchange(e.target.value);}});
  const doConfirm=()=>{const v=aInp.value.trim();if(!v)return;customArr.push(v);if(catKey)document.querySelectorAll(`select[data-cat="${catKey}"]`).forEach(s=>addOptToSel(s,v));else addOptToSel(sel,v);sel.value=v;prev=v;aRow.style.display='none';aInp.value='';onchange(v);saveState();};
  aInp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doConfirm();}if(e.key==='Escape'){aRow.style.display='none';aInp.value='';sel.value=prev;}});
  xBtn.addEventListener('click',()=>{aRow.style.display='none';aInp.value='';sel.value=prev;});
  wrap.appendChild(sel);wrap.appendChild(aRow);return{wrap,sel};
}
const csA={cat:'TH',sz:'1/4"',type:'母直',dir:'順向',spec:''};
const csB={cat:'TH',sz:'1/4"',type:'母直',dir:'順向',spec:''};
function syncBfromA(mountId){
  if(mountId!=='mntA')return;
  if(csA.cat==='其他'||csA.cat==='無壓接')return;
  if(csB.cat==='其他'||csB.cat==='無壓接')return;
  csB.cat=csA.cat;csB.sz=csA.sz;
  buildConn('mntB',csB,'pvB');
}
function buildConn(mountId,cs,pvId){
  const mnt=document.getElementById(mountId);mnt.innerHTML='';
  const row=document.createElement('div');row.className='conn-row';
  const catSel=document.createElement('select');catSel.className='ssel';
  [['鋼管頭','鋼管頭'],['TH','TH頭'],['無壓接','無'],['其他','其他']].forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;if(v===cs.cat)o.selected=true;catSel.appendChild(o);});
  catSel.style.flex='0 1 auto';
  catSel.addEventListener('change',e=>{
    cs.cat=e.target.value;
    if(cs.cat==='TH')cs.sz=TH_SZ[1];
    else if(cs.cat==='鋼管頭')cs.sz=ST_SZ[0];
    else if(cs.cat==='其他'){cs.spec=cs.spec||'';cs.sz='';if(!cs.type)cs.type='母直';}
    buildConn(mountId,cs,pvId);syncBfromA(mountId);
  });
  row.appendChild(catSel);
  if(cs.cat==='無壓接'){
    // 不需規格與外型
  }else if(cs.cat==='其他'){
    const mkTxt=(ph,val,on)=>{const i=document.createElement('input');i.type='text';i.className='inp-b';i.placeholder=ph;i.value=val||'';i.autocomplete='off';i.style.cssText='flex:1 1 auto;min-width:0;width:auto;padding:5px 8px;font-size:14px';i.addEventListener('input',e=>{on(e.target.value);updPv(cs,pvId);});return i;};
    row.appendChild(mkTxt('規範',cs.spec,v=>cs.spec=v));
    row.appendChild(mkTxt('尺寸',cs.sz,v=>cs.sz=v));
    if(!cs.type)cs.type='母直';
    const typeCtrl=mkSelWrap(BASE_TYPES,custom.types,cs.type,v=>{cs.type=v;dirWrap.style.display=isDirect(v)?'none':'block';if(isDirect(v))cs.dir='順向';updPv(cs,pvId);},'type');
    const dirWrap=document.createElement('div');dirWrap.style.cssText='flex:1 1 auto;min-width:76px;display:'+(isDirect(cs.type)?'none':'block');
    const dirSel=document.createElement('select');dirSel.className='ssel';
    ['順向','反向'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;if(v===cs.dir)o.selected=true;dirSel.appendChild(o);});
    dirSel.addEventListener('change',e=>{cs.dir=e.target.value;updPv(cs,pvId);});
    dirWrap.appendChild(dirSel);
    row.appendChild(typeCtrl.wrap);row.appendChild(dirWrap);
  }else{
    const szKey=cs.cat==='TH'?'THSz':'STSz';
    const szCtrl=mkSelWrap(cs.cat==='TH'?TH_SZ:ST_SZ,cs.cat==='TH'?custom.THSz:custom.STSz,cs.sz,v=>{cs.sz=v;updPv(cs,pvId);if(mountId==='mntA'&&csB.cat===csA.cat){csB.sz=csA.sz;buildConn('mntB',csB,'pvB');}},szKey);
    const typeCtrl=mkSelWrap(BASE_TYPES,custom.types,cs.type,v=>{cs.type=v;dirWrap.style.display=isDirect(v)?'none':'block';if(isDirect(v))cs.dir='順向';updPv(cs,pvId);},'type');
    const dirWrap=document.createElement('div');dirWrap.style.cssText='flex:1 1 auto;min-width:76px;display:'+(isDirect(cs.type)?'none':'block');
    const dirSel=document.createElement('select');dirSel.className='ssel';
    ['順向','反向'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;if(v===cs.dir)o.selected=true;dirSel.appendChild(o);});
    dirSel.addEventListener('change',e=>{cs.dir=e.target.value;updPv(cs,pvId);});
    dirWrap.appendChild(dirSel);
    row.appendChild(szCtrl.wrap);row.appendChild(typeCtrl.wrap);row.appendChild(dirWrap);
  }
  mnt.appendChild(row);updPv(cs,pvId);
}

// ── 管徑 / 層數 / 壓力 ────────────────────────────────────────────
function rebuildLayers(bore){
  const ls=document.getElementById('inp-layers');
  const cur=ls.value;ls.innerHTML='';
  const blank=document.createElement('option');blank.value='';blank.textContent='—';ls.appendChild(blank);
  const opts=(bore&&BORE_LAYERS[bore])?BORE_LAYERS[bore]:[1,2,4];
  opts.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l+'層';ls.appendChild(o);});
  ls.value=(opts.includes(parseInt(cur)))?cur:'';
}
function initBoreSection(){
  const boreSel=document.getElementById('inp-bore');
  const blank=document.createElement('option');blank.value='';blank.textContent='—';boreSel.appendChild(blank);
  BORE_OPT.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b;boreSel.appendChild(o);});
  boreSel.value=boreFromConn(csA)||'';
  rebuildLayers(boreFromConn(csA));
  boreSel.addEventListener('change',e=>rebuildLayers(e.target.value||null));
  // 層數與耐壓可並存，各自獨立
}
function getSpec(){
  const bore=document.getElementById('inp-bore').value||null;
  const lv=document.getElementById('inp-layers').value;
  const layers=lv?parseInt(lv):null;
  const pv=document.getElementById('inp-pressure').value;
  const pressure=pv?parseInt(pv):null;
  return{bore,layers,pressure};
}
function setSpec(bore,layers,pressure){
  document.getElementById('inp-bore').value=bore||'';rebuildLayers(bore||null);
  const ls=document.getElementById('inp-layers');
  if(layers){for(let i=0;i<ls.options.length;i++){if(parseInt(ls.options[i].value)===layers){ls.selectedIndex=i;break;}}}
  else ls.value='';
  document.getElementById('inp-pressure').value=pressure||'';
}

// ── 使用接頭 ──────────────────────────────────────────────────────
let formFittings=[];
function defaultFitting(){const hoseMat=document.getElementById('inp-material')?.value||'鐵';return{shape:'',ports:[],qty:1,material:hoseMat};}
function defaultPort(){return{spec:'',gender:null,size:''};}
function syncFromE1(f){
  const e1=f.ports[0];if(!e1)return false;
  let ch=false;
  if(f.shape==='三通'||f.shape==='穿艙'){ // 端1 -> 其餘全部，無條件
    for(let i=1;i<f.ports.length;i++){
      const t=f.ports[i];
      if(t.spec!==e1.spec||t.gender!==e1.gender||t.size!==e1.size){t.spec=e1.spec;t.gender=e1.gender;t.size=e1.size;ch=true;}
    }
    return ch;
  }
  if((f.shape==='直接頭'||f.shape==='90度')&&e1.spec){ // 變更3：端1 -> 端2，僅當端2允許集含端1規範，否則端2不動
    const allowed=allowedSpecsFor(f,1);
    if(Array.isArray(allowed)&&allowed.includes(e1.spec)){
      const t=f.ports[1];
      if(t&&(t.spec!==e1.spec||t.gender!==e1.gender||t.size!==e1.size)){t.spec=e1.spec;t.gender=e1.gender;t.size=e1.size;ch=true;}
    }
    return ch;
  }
  return false;
}
function plugSpecStr(f){
  const p=(f.ports||[])[0];
  if(!p||!p.spec)return'(未完成)';
  const sp=PORT_SPECS[p.spec];
  let str='塞頭-'+sp.name+p.size;
  if(p.spec==='TH_Fitting')str+=(p.gender||'母');
  if(p.spec==='PT_Thread')str+='('+(f.hex||'外六角')+')';
  return str;
}
function plugNutSpec(f){
  if(f.shape!=='塞頭')return null;
  const p=(f.ports||[])[0];
  if(!p||p.spec!=='Steel_Tube_Fitting')return null;
  if(f.nut===false)return null;
  return p.size+'螺帽';
}
function ballEyeStr(f){
  const p1=(f.ports||[])[0]||{},p2=(f.ports||[])[1]||{};
  if(!p1.size||!p2.size)return'(未完成)';
  let tail;
  if(p2.spec==='Insert_Fitting'){tail='*插心 '+String(p2.size||'');}        // 變更5：端2 插心
  else{tail='*TH '+String(p2.size||'').replace(/"$/,'');}                    // 端2 TH公頭（沿用）
  return'魚眼接頭-'+ballEyeE1Out(p1.size)+'(含螺絲與墊圈)'+tail;
}
function fittingLabel(f){
  if(!f.shape)return'(未完成)';
  if(f.shape==='塞頭')return plugSpecStr(f)+' ×'+f.qty;
  if(f.shape==='魚眼')return ballEyeStr(f)+' ×'+f.qty;
  const portStrs=(f.ports||[]).filter(p=>p.spec).map(p=>{
    const short=SHORT[p.spec]||p.spec;const sp=PORT_SPECS[p.spec];
    const gender=(sp&&sp.genders&&p.gender)?p.gender:'';
    return`${short}${p.size}${gender}`;
  });
  return`${f.shape}-${portStrs.join('*')} ×${f.qty}`;
}
function fittingSpec(f){
  if(!f.shape)return'(未完成)';
  if(f.shape==='塞頭')return plugSpecStr(f);
  if(f.shape==='魚眼')return ballEyeStr(f);
  const portStrs=(f.ports||[]).filter(p=>p.spec).map(p=>{
    const short=SHORT[p.spec]||p.spec;const sp=PORT_SPECS[p.spec];
    const gender=(sp&&sp.genders&&p.gender)?p.gender:'';
    return`${short}${p.size}${gender}`;
  });

function mkSimpleSel(opts,val,getText,onChange,blankLabel){

function getSizeForBore(specKey,bore){
  if(!bore)return null;const sp=PORT_SPECS[specKey];if(!sp)return null;
  if(specKey==='Steel_Tube_Fitting'){return sp.sizes.find(s=>BORE_MAP.ST[s]===bore)||null;}
  const c=bore+'"';if(sp.sizes.includes(c))return c;if(sp.sizes.includes(bore))return bore;return null;
}
function getSizeFromEnd(specKey){
  if(currentKind!=='hose')return null;
  if(specKey==='TH_Fitting'){if(csA.cat==='TH')return csA.sz;if(csB.cat==='TH')return csB.sz;}
  else if(specKey==='Steel_Tube_Fitting'){if(csA.cat==='鋼管頭')return csA.sz;if(csB.cat==='鋼管頭')return csB.sz;}
  return null;
}

function sortedRecs(){
  const base=records.filter(r=>r.kind!=='conn');
  if(!sortCol)return base;
  return base.sort((a,b)=>{
    let av,bv;
    if(sortCol==='a'){av=buildLabel(a.a);bv=buildLabel(b.a);}
    else if(sortCol==='b'){av=buildLabel(a.b);bv=buildLabel(b.b);}
    else if(sortCol==='len'){av=a.len;bv=b.len;}
    else if(sortCol==='bore'){av=a.bore||'';bv=b.bore||'';}
    else if(sortCol==='layers'){av=a.layers||0;bv=b.layers||0;}
    else if(sortCol==='pressure'){av=a.pressure||0;bv=b.pressure||0;}
    else if(sortCol==='qty'){av=a.qty;bv=b.qty;}
    else if(sortCol==='material'){av=a.material||'';bv=b.material||'';}
    else if(sortCol==='brand'){av=a.brand||'';bv=b.brand||'';}
    else if(sortCol==='note'){av=a.note||'';bv=b.note||'';}
    else{av=a.vendor||'';bv=b.vendor||'';}
    return(av<bv?-1:av>bv?1:0)*(sortDir==='asc'?1:-1);
  });
}
function buildConnRows(){
  const rows=[];
  const pushFit=(f,source,note,indep,recId)=>{
    rows.push({spec:fittingSpec(f),qty:f.qty,material:f.material||'鐵',source,note,indep,recId,fit:f,vKey:'toVendor',checked:f.toVendor!==false});
    const nut=plugNutSpec(f);
    if(nut)rows.push({spec:nut,qty:f.qty,material:f.material||'鐵',source,note,indep:false,nutRow:true,fit:f,vKey:'nutToVendor',checked:f.nutToVendor!==false});
  };
  sortedRecs().forEach(r=>{(r.fittings||[]).filter(f=>f.shape).forEach(f=>pushFit(f,(r.seq!=null&&r.seq!==''?'搭配軟管[編號 '+r.seq+']':'搭配軟管(未編號)'),'',false));});
  records.filter(r=>r.kind==='conn').forEach(r=>{(r.fittings||[]).filter(f=>f.shape).forEach(f=>pushFit(f,'獨立',r.note||'',true,r.id));});
  return rows;
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function showConfirm(msg,onConfirm,okText,cancelText){
  okText=okText||'確定';cancelText=cancelText||'取消';
  const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem';

  const p=document.createElement('p');p.style.cssText='font-size:14px;color:var(--tp);line-height:1.6;margin-bottom:18px;white-space:pre-line';p.textContent=msg;
  const btns=document.createElement('div');btns.style.cssText='display:flex;gap:8px;justify-content:flex-end';
  const cancelBtn=document.createElement('button');cancelBtn.className='btn';cancelBtn.textContent=cancelText;cancelBtn.style.cssText='padding:7px 14px;font-size:14px';
  const okBtn=document.createElement('button');okBtn.style.cssText='background:#b91c1c;color:#fff;border:none;border-radius:var(--rm);padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--fs)';okBtn.textContent=okText;
  cancelBtn.addEventListener('click',()=>ov.remove());okBtn.addEventListener('click',()=>{ov.remove();onConfirm();});
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  btns.appendChild(cancelBtn);btns.appendChild(okBtn);box.appendChild(p);box.appendChild(btns);ov.appendChild(box);document.body.appendChild(ov);okBtn.focus();
}

function dateStr(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function dateTimeStr(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');}

function fitInline(r){return(r.fittings||[]).filter(f=>f.shape).map(f=>fittingSpec(f)+' ×'+f.qty).join('\n');}
function aoaHoseFull(){
  const head=['項次','A端','B端','長度(mm)','管徑','層數','耐壓(BAR)','數量','端頭材質','廠牌','編號','位置/功用/備註','說明(給廠商)'];
  return[head,...sortedRecs().map((r,i)=>[i+1,buildLabel(r.a),buildLabel(r.b),r.len,r.bore||'',r.layers?r.layers+'層':'',r.pressure||'',r.qty||1,r.material||'鐵',r.brand||'-',r.seq!=null?r.seq:'',r.note||'',r.vendor||''])];
}
function aoaHoseVendor(recs){
  recs=recs||sortedRecs();
  const head=['編號','A端','B端','長度(mm)','管徑','層數','耐壓(BAR)','端頭材質','廠牌','說明(給廠商)','數量'];
  const aoa=[head,...recs.map(r=>[r.seq!=null?r.seq:'',buildLabel(r.a),buildLabel(r.b),r.len,r.bore||'',r.layers?r.layers+'層':'',r.pressure||'',r.material||'鐵',r.brand||'-',r.vendor||'',r.qty||1])];
  const totalQty=recs.reduce((s,r)=>s+(r.qty||1),0);
  aoa.push([`合計筆數：${recs.length} 筆，軟管總數：${totalQty} 條`,...Array(head.length-1).fill('')]);
  return aoa;
}
function aoaConnFull(){
  const head=['規格','數量','材質','來源','備註'];
  return[head,...buildConnRows().map(x=>[x.spec,x.qty,x.material,x.source,x.note||''])];
}
function aoaConnVendor(rows){
  rows=rows||buildConnRows();
  const head=['規格','材質','數量'];
  const map=new Map();
  rows.forEach(x=>{
    const key=x.spec+'\x00'+(x.material||'鐵');
    if(map.has(key)){map.get(key).qty+=x.qty;}
    else{map.set(key,{spec:x.spec,material:x.material||'鐵',qty:x.qty});}
  });
  return[head,...[...map.values()].map(x=>[x.spec,x.material,x.qty])];
}
function toRichRuns(s,sz){
  if(!s)return null;const str=String(s);if(!str)return null;
  const runs=[];let cur='';let inCJK=null;
  for(const ch of str){
    const c=/[\u4e00-\u9fff\u3000-\u303f\u3400-\u4dbf\uf900-\ufaff\uff01-\uffee]/.test(ch);
    if(inCJK===null)inCJK=c;
    if(c!==inCJK){if(cur)runs.push({font:{name:inCJK?'標楷體':'Times New Roman',size:sz},text:cur});cur=ch;inCJK=c;}else cur+=ch;
  }
  if(cur)runs.push({font:{name:inCJK?'標楷體':'Times New Roman',size:sz},text:cur});
  return runs.length>1?{richText:runs}:null;
}
async function dlStyledXlsx(listTitle,aoa,filename,includeProject=true,hasSummaryRow=false,opts={}){
  if(typeof ExcelJS==='undefined'){showToast('Excel 套件未載入（需連網）');return;}
  if(aoa.length<=1){showToast('清單為空，無法匯出');return;}
  const wb=new ExcelJS.Workbook();wb.creator='HoseApp v4.0';
  const ws=wb.addWorksheet(listTitle);
  const nc=aoa[0].length;const dt=cellDateStr();
  const projName=(includeProject&&document.getElementById('inp-project')?.value.trim())||'';
  const titleText=projName?projName+' '+listTitle:listTitle;
  ws.addRow([titleText]);ws.mergeCells(1,1,1,nc);
  const r1c1=ws.getCell(1,1);r1c1.value=titleText;
  r1c1.font={name:'標楷體',size:18,bold:true};r1c1.alignment={horizontal:'center',vertical:'middle',wrapText:false};ws.getRow(1).height=32;
  ws.addRow(['建檔日期：'+dt]);ws.mergeCells(2,1,2,nc);
  const r2c1=ws.getCell(2,1);r2c1.value='建檔日期：'+dt;
  r2c1.font={name:'標楷體',size:12};r2c1.alignment={horizontal:'left',vertical:'middle',wrapText:false};ws.getRow(2).height=20;
  ws.addRow(aoa[0]);
  ws.getRow(3).eachCell({includeEmpty:true},(cell,col)=>{
    if(col>nc)return;
    cell.font={name:'標楷體',size:12,bold:true};cell.alignment={horizontal:'center',vertical:'middle',wrapText:false};
    cell.border={bottom:{style:'thin',color:{argb:'FF888888'}}};
  });ws.getRow(3).height=20;
  aoa.slice(1).forEach((rowData,idx)=>{
    const isSummary=hasSummaryRow&&(idx===aoa.length-2);
    const row=ws.addRow(rowData.map(v=>v==null?'':v));
    if(isSummary){
      ws.mergeCells(row.number,1,row.number,nc);
      const cell=ws.getCell(row.number,1);
      cell.value=rowData[0];
      cell.font={name:'標楷體',size:12,bold:true};
      cell.alignment={horizontal:'center',vertical:'middle',wrapText:false};
      ws.getRow(row.number).height=20;
      return;
    }
    row.eachCell({includeEmpty:true},(cell,col)=>{
      if(col>nc)return;
      const v=cell.value;
      if(typeof v==='number'){cell.font={name:'Times New Roman',size:12};}
      else{
        const str=String(v==null?'':v);
        const rich=toRichRuns(str,12);
        if(rich){cell.value=rich;}else{cell.font={name:/[\u4e00-\u9fff]/.test(str)?'標楷體':'Times New Roman',size:12};}
      }
      cell.alignment={horizontal:'left',vertical:'middle',wrapText:false};
    });
  });
  ws.columns=aoa[0].map((_,ci)=>{
    const maxLen=Math.max(...aoa.map(r=>{const s=String(r[ci]==null?'':r[ci]);let w=0;for(const ch of s){w+=/[\u1100-\u11FF\u2E80-\u9FFF\uA960-\uA97F\uAC00-\uD7FF\uF900-\uFAFF\uFE10-\uFE1F\uFE30-\uFE6F\uFF01-\uFF60\uFFE0-\uFFE6]/.test(ch)?2.2:1.1;}return w;}));
    return{width:Math.min(Math.max(Math.ceil(maxLen)+2,10),60)};
  });
  ws.eachRow((row,rn)=>{if(rn<=3)return;row.height=18;});
  if(opts.frameCols&&opts.frameCols.length){
    const top=3,bottom=hasSummaryRow?3+aoa.length-2:3+aoa.length-1;
    if(bottom>=top)opts.frameCols.forEach(ci=>{
      for(let r=top;r<=bottom;r++){
        const cell=ws.getCell(r,ci);
        const b=Object.assign({},cell.border||{});
        b.left={style:'medium',color:{argb:'FF000000'}};
        b.right={style:'medium',color:{argb:'FF000000'}};
        if(r===top){b.top={style:'medium',color:{argb:'FF000000'}};if(!b.bottom)b.bottom={style:'thin',color:{argb:'FF888888'}};}
        if(r===bottom)b.bottom={style:'medium',color:{argb:'FF000000'}};
        cell.border=b;
      }
    });
  }
  if(opts.noteText&&String(opts.noteText).trim()){
    const txt=String(opts.noteText);
    ws.addRow([]);
    const nr=ws.addRow([txt]);
    ws.mergeCells(nr.number,1,nr.number,nc);
    const c=ws.getCell(nr.number,1);
    c.value=txt;
    c.font={name:'標楷體',size:12};
    c.alignment={horizontal:'left',vertical:'top',wrapText:true};
    ws.getRow(nr.number).height=Math.max(18,txt.split('\n').length*18);
  }
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function copyAoa(aoa){
  if(aoa.length<=1){showToast('清單為空');return;}
  const html='<table border="1" style="border-collapse:collapse">'+aoa.map((row,ri)=>'<tr>'+row.map(c=>{const t=esc(String(c==null?'':c)).replace(/\n/g,'<br>');return ri===0?`<th>${t}</th>`:`<td>${t}</td>`;}).join('')+'</tr>').join('')+'</table>';
  const tsv=aoa.map(row=>row.map(c=>String(c==null?'':c).replace(/\n/g,' / ').replace(/\t/g,' ')).join('\t')).join('\n');
  try{
    await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([tsv],{type:'text/plain'})})]);
    showToast('✓ 已複製，貼到 Excel 即成表格');
  }catch(e){
    try{await navigator.clipboard.writeText(tsv);showToast('✓ 已複製（純文字 Tab 分隔）');}
    catch(_){showToast('複製失敗，請改用匯出按鈕');}
  }
}
document.getElementById('btn-copy-hose').addEventListener('click',()=>copyAoa(aoaHoseFull()));
document.getElementById('btn-copy-conn').addEventListener('click',()=>copyAoa(aoaConnFull()));

// ── 其他需求 ──────────────────────────────────────────────────────
function renderOthers(){
  const panel=document.getElementById('oth-list-panel'),empty=document.getElementById('oth-empty');
  updateOthCount();
  if(!others.length){panel.style.display='none';empty.style.display='block';return;}
  panel.style.display='block';empty.style.display='none';
  const thead=document.getElementById('oth-thead');thead.innerHTML='';
  ['項次','品名','數量','用途','選項'].forEach((h,i)=>{
    const th=document.createElement('th');th.innerHTML=`<div class="th-inner"${i===0||i===2||i===4?' style="justify-content:center"':''}>${h}</div>`;thead.appendChild(th);
  });
  const tbody=document.getElementById('oth-tbody');tbody.innerHTML='';
  others.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.appendChild(mkTd(i+1,'ctr'));
    tr.appendChild(mkTd(esc(r.name||'')));
    tr.appendChild(mkTd(r.qty||1,'ctr'));
    tr.appendChild(mkTd(esc(r.usage||'')));
    const ops=document.createElement('td');ops.style.cssText='white-space:nowrap;padding:4px 6px;text-align:center';
    ops.innerHTML=`<div class="act-btns"><button class="btn-ed oth-ed-btn" data-id="${r.id}" title="編輯">✏</button><button class="btn-dl oth-dl-btn" data-id="${r.id}" title="刪除">✕</button></div>`;
    tr.appendChild(ops);tbody.appendChild(tr);
  });
  tbody.querySelectorAll('.oth-ed-btn').forEach(b=>b.addEventListener('click',()=>{
    const r=others.find(x=>x.id===parseInt(b.dataset.id));if(!r)return;
    document.getElementById('oth-name').value=r.name||'';
    document.getElementById('oth-qty').value=r.qty||1;
    document.getElementById('oth-usage').value=r.usage||'';
    othEditId=r.id;
    const fp=document.getElementById('others-form-panel');fp.classList.replace('mode-new','mode-edit');
    const badge=document.getElementById('others-mode-badge');badge.textContent='編輯';badge.className='mbadge mb-edit';
    document.getElementById('oth-ico').textContent='✓';document.getElementById('oth-lbl').textContent='儲存';
    document.getElementById('oth-cancel').style.display='inline-flex';
    fp.scrollIntoView({behavior:'smooth',block:'start'});
  }));
  tbody.querySelectorAll('.oth-dl-btn').forEach(b=>b.addEventListener('click',()=>{
    showConfirm('確定刪除這筆其他需求？',()=>{others=others.filter(x=>x.id!==parseInt(b.dataset.id));renderOthers();saveState();showToast('✓ 已刪除');});
  }));
}
function othResetForm(){
  document.getElementById('oth-name').value='';document.getElementById('oth-qty').value=1;document.getElementById('oth-usage').value='';
  othEditId=null;
  const fp=document.getElementById('others-form-panel');fp.classList.replace('mode-edit','mode-new');
  const badge=document.getElementById('others-mode-badge');badge.textContent='新增';badge.className='mbadge mb-new';
  document.getElementById('oth-ico').textContent='＋';document.getElementById('oth-lbl').textContent='加到清單';
  document.getElementById('oth-cancel').style.display='none';
}
document.getElementById('oth-sub').addEventListener('click',()=>{
  const name=document.getElementById('oth-name').value.trim();
  const qty=Math.max(1,parseInt(document.getElementById('oth-qty').value)||1);
  const usage=document.getElementById('oth-usage').value.trim();
  if(!name){document.getElementById('oth-name').focus();showToast('請填寫品名');return;}
  if(othEditId!==null){
    const r=others.find(x=>x.id===othEditId);if(r){r.name=name;r.qty=qty;r.usage=usage;}
  }else{others.push({id:nextOthId++,name,qty,usage});}
  othResetForm();renderOthers();saveState();
});
document.getElementById('oth-cancel').addEventListener('click',()=>othResetForm());
document.getElementById('oth-clear').addEventListener('click',()=>{
  showConfirm('確定清空所有其他需求？',()=>{others=[];nextOthId=1;othResetForm();renderOthers();saveState();showToast('✓ 已清空');});
});
document.getElementById('oth-x-full').addEventListener('click',async()=>{
  if(!others.length){showToast('清單為空');return;}
  const proj=document.getElementById('inp-project').value.trim();

});
